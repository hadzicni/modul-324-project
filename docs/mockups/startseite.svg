<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" font-family="Helvetica, Arial, sans-serif">
  <style>
    .label { font-size: 13px; fill: #6b7280; }
    .chrome { font-size: 14px; fill: #9ca3af; }
    .input-text { font-size: 15px; fill: #4b5563; }
    .body { font-size: 15px; fill: #374151; }
    .h1 { font-size: 38px; font-weight: bold; fill: #111827; letter-spacing: -0.02em; }
    .h2 { font-size: 21px; font-weight: bold; fill: #111827; }
    .h3 { font-size: 16px; font-weight: bold; fill: #111827; }
    .btn-text { font-size: 15px; font-weight: bold; fill: #ffffff; }
    .btn-text-alt { font-size: 14px; fill: #374151; }
    .badge { font-size: 13px; font-weight: bold; fill: #ffffff; }
    .note { font-size: 13px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    .fill { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1.5; }
    .placeholder { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .primary { fill: #374151; }
    .outline { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
  </style>

  <rect width="1280" height="1180" fill="#ffffff"/>

  <!-- ============ Browser frame ============ -->
  <rect x="40" y="40" width="1200" height="690" rx="8" class="box"/>
  <rect x="40" y="40" width="1200" height="40" rx="8" fill="#f3f4f6"/>
  <rect x="40" y="70" width="1200" height="10" fill="#f3f4f6"/>
  <circle cx="64" cy="60" r="5" fill="#d1d5db"/>
  <circle cx="82" cy="60" r="5" fill="#d1d5db"/>
  <circle cx="100" cy="60" r="5" fill="#d1d5db"/>
  <rect x="124" y="50" width="300" height="20" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="138" y="64" class="chrome">tournament-maker.local</text>

  <!-- ============ 1. Kopfzeile ============ -->
  <rect x="40" y="80" width="1200" height="72" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="80" y="102" width="28" height="28" rx="6" class="fill"/>
  <text x="120" y="123" class="h3">Tournament Maker</text>
  <text x="940" y="122" class="body">Meine Turniere</text>
  <rect x="1070" y="102" width="130" height="30" rx="6" class="outline"/>
  <text x="1092" y="122" class="btn-text-alt">Anmelden</text>
  <circle cx="60" cy="116" r="13" class="primary"/>
  <text x="56" y="121" class="badge">1</text>

  <!-- ============ 2. Turnier erstellen (einzige Hauptaktion) ============ -->
  <rect x="40" y="152" width="1200" height="268" fill="#fafafa"/>
  <text x="640" y="222" class="h1" text-anchor="middle">Turniere erstellen und verwalten</text>
  <text x="640" y="258" class="body" text-anchor="middle">Teilnehmer eintragen, Spielpaarungen generieren, Sieger ermitteln.</text>

  <text x="279" y="304" class="label">Turniername</text>
  <rect x="279" y="316" width="520" height="48" rx="6" class="fill"/>
  <text x="295" y="346" class="input-text">z. B. Sommer-Cup 2026</text>
  <rect x="811" y="316" width="190" height="48" rx="6" class="primary"/>
  <text x="906" y="346" class="btn-text" text-anchor="middle">Erstellen</text>
  <text x="279" y="390" class="note">Nach dem Erstellen werden die Teilnehmer hinzugefügt.</text>

  <circle cx="60" cy="286" r="13" class="primary"/>
  <text x="56" y="291" class="badge">2</text>

  <!-- ============ 3. Meine Turniere ============ -->
  <text x="112" y="470" class="h2">Meine Turniere</text>
  <text x="1070" y="470" class="label" text-anchor="end">Alle anzeigen</text>

  <rect x="80" y="490" width="1120" height="64" rx="8" class="box"/>
  <text x="112" y="520" class="h3">Sommer-Cup 2026</text>
  <text x="112" y="540" class="label">8 Teilnehmer · Runde 2 von 3</text>
  <rect x="1040" y="506" width="130" height="34" rx="6" class="outline"/>
  <text x="1105" y="528" class="btn-text-alt" text-anchor="middle">Öffnen</text>

  <rect x="80" y="566" width="1120" height="64" rx="8" class="box"/>
  <text x="112" y="596" class="h3">FIFA Abendturnier</text>
  <text x="112" y="616" class="label">4 Teilnehmer · Abgeschlossen · Sieger: M. Keller</text>
  <rect x="1040" y="582" width="130" height="34" rx="6" class="outline"/>
  <text x="1105" y="604" class="btn-text-alt" text-anchor="middle">Öffnen</text>

  <circle cx="60" cy="543" r="13" class="primary"/>
  <text x="56" y="548" class="badge">3</text>

  <!-- ============ 4. Fusszeile ============ -->
  <rect x="40" y="666" width="1200" height="64" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="112" y="704" class="label">Tournament Maker · Modul 324</text>
  <circle cx="60" cy="698" r="13" class="primary"/>
  <text x="56" y="703" class="badge">4</text>

  <!-- ============ Leerzustand ============ -->
  <text x="40" y="786" class="h3">Leerzustand: noch keine Turniere</text>
  <rect x="40" y="800" width="600" height="200" rx="8" class="box"/>
  <text x="72" y="840" class="h2">Meine Turniere</text>
  <rect x="72" y="858" width="536" height="118" rx="8" class="placeholder"/>
  <text x="340" y="900" class="body" text-anchor="middle">Noch keine Turniere vorhanden.</text>
  <rect x="250" y="918" width="180" height="40" rx="6" class="primary"/>
  <text x="340" y="943" class="btn-text" text-anchor="middle">Turnier erstellen</text>

  <!-- ============ Legende ============ -->
  <text x="40" y="1050" class="h3">Legende</text>
  <text x="40" y="1078" class="body">1  Kopfzeile: Logo, Navigation und Anmelden</text>
  <text x="40" y="1102" class="body">2  Turnier erstellen: Eingabefeld Turniername und Button "Erstellen"</text>
  <text x="40" y="1126" class="body">3  Meine Turniere: bestehende Turniere mit Status und Button "Öffnen"</text>
  <text x="40" y="1150" class="body">4  Fusszeile</text>
  <text x="700" y="1078" class="body">Leerzustand: Liste ohne Turniere mit Hinweis</text>
  <text x="700" y="1102" class="body">und Startaktion.</text>
  <text x="700" y="1140" class="note">Wireframe ohne Farbgebung – Farben und</text>
  <text x="700" y="1158" class="note">Schriften werden in #16 festgelegt.</text>
</svg>
